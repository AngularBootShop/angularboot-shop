name: Frontend CI & E2E Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Angular Build, Test & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/shop-ui

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/shop-ui/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Verify Generated OpenAPI Clients
        run: npm run generate:api

      - name: Run Production Build
        run: npm run build

      - name: Run Karma Unit Tests in Headless Chrome
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build Frontend Docker Image
        run: |
          docker build -t shop/shop-ui:local .

      - name: Run Trivy Container Scan on Frontend Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'shop/shop-ui:local'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
