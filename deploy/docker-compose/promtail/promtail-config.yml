server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: system_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_name']
        regex: '/?(catalog-service|order-service|api-gateway|shop-ui)'
        target_label: 'service'
        replacement: '$1'
    pipeline_stages:
      - json:
          expressions:
            traceId: traceId
            spanId: spanId
            level: level
            message: message
            service: service
      - labels:
          traceId:
          spanId:
          level:
          service:
