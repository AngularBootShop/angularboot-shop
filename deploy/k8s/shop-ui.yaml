apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-ui
  namespace: shop
  labels:
    app.kubernetes.io/name: shop-ui
    app.kubernetes.io/part-of: shop-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: shop-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shop-ui
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx unprivileged user
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shop-ui
          image: shop/shop-ui:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 4200
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
            - name: cache-volume
              mountPath: /var/cache/nginx
            - name: log-volume
              mountPath: /var/log/nginx
          livenessProbe:
            httpGet:
              path: /healthz
              port: 4200
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 4200
            periodSeconds: 5
            timeoutSeconds: 3
      volumes:
        - name: tmp-volume
          emptyDir: {}
        - name: cache-volume
          emptyDir: {}
        - name: log-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shop-ui
  namespace: shop
  labels:
    app.kubernetes.io/name: shop-ui
spec:
  type: ClusterIP
  ports:
    - port: 4200
      targetPort: 4200
      name: http
  selector:
    app.kubernetes.io/name: shop-ui
